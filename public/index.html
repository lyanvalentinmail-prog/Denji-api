<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Denji API</title>
  <meta name="description" content="Denji API — API REST publica y gratuita. Anime, descargas, busquedas, herramientas e IA." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/home">
      <span class="brand__mark">電</span>
      <span class="brand__text">
        <strong>DENJI</strong>
        <em>api rest</em>
      </span>
    </a>

    <nav class="topnav">
      <a href="/home" data-nav>home</a>
      <a href="https://github.com/lyanvalentinmail-prog/Denji-api" target="_blank" rel="noopener">github</a>
    </nav>

    <!-- Interruptor NSFW: sin texto, casi transparente, apagado por defecto -->
    <button
      id="nsfw-toggle"
      class="nsfw-toggle"
      type="button"
      aria-pressed="false"
      aria-label="Activar contenido NSFW"
      title="Contenido +18 (desactivado)"></button>
  </header>

  <main id="app">
    <div class="loading">cargando catalogo…</div>
  </main>

  <footer class="foot">
    <span id="foot-stats">—</span>
    <span>sin api keys · sin registro</span>
  </footer>

  <div id="gate" class="gate" hidden>
    <div class="gate__box">
      <h2>Contenido para adultos</h2>
      <p>
        Vas a desbloquear los endpoints <strong>+18</strong> de esta API.
        Al continuar confirmas que tienes 18 años o más y que el acceso a este
        tipo de contenido es legal donde te encuentras.
      </p>
      <div class="gate__actions">
        <button type="button" class="btn btn--ghost" data-gate="cancel">Cancelar</button>
        <button type="button" class="btn btn--danger" data-gate="confirm">Tengo 18+ , activar</button>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
